name: PCGPT Quality Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          set -e
          node --check app.js
          node --check engine.js
          node --check operator.js
          node --check sw.js
      - name: Validate required app files
        run: |
          set -e
          for file in index.html styles.css app.js engine.js operator.js sw.js manifest.webmanifest; do
            test -s "$file"
          done
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Scan for accidental secrets
        run: |
          set -e
          if grep -RniE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' --exclude-dir=.git .; then
            echo 'Possible secret detected.'
            exit 1
          fi
